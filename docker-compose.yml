version: '3.8'

services:
  # Flask后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: flask-api
    restart: unless-stopped
    env_file:
      - .env  # 添加这行，从.env文件读取
    environment:
      # 保留固定的配置
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - MONGODB_URI=${MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION}
      # 添加 Azure OpenAI 环境变量
      - AZURE_AI_API_KEY_4O=${AZURE_AI_API_KEY_4O}
      - AZURE_AI_ENDPOINT_4O=${AZURE_AI_ENDPOINT_4O}
    ports:
      - "127.0.0.1:5000:5000"  # 只绑定到本地，通过nginx代理
    volumes:
      - backend_logs:/app/logs
    networks:
      - api-network
    # depends_on:
    #   mongodb:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx反向代理服务
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  # Dozzle日志查看器
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # 只绑定到本地，通过nginx代理
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_LEVEL=info
      - DOZZLE_TAIL_SIZE=300
      - DOZZLE_FILTER="name=mongodb,flask-api,nginx-proxy,mongo-express"
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=NianNian_mysql_root_2025
      - MYSQL_DATABASE=NianNian
      - MYSQL_USER=NianNian_user
      - MYSQL_PASSWORD=NianNian_password_2025
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"  # 暴露给主机，供其他后端服务器访问
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

# 网络配置
networks:
  api-network:
    driver: bridge
    name: api-network

# 数据卷配置
volumes:
  backend_logs:
    name: backend_logs
  nginx_logs:
    name: nginx_logs
  mysql_data:
    name: mysql_data

